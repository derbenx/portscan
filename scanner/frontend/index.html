<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Network Scanner</title>
</head>
<body>
<div id="app">
    <div id="app-content">
        <div id='tab'>
            <table>
                <tr>
                    <td>Base IP</td>
                    <td>Start IP</td>
                    <td>End IP</td>
                    <td>first port</td>
                    <td>last port</td>
                    <td>timeout</td>
                    <td>conns</td>
                    <td>rand</td>
                    <td>cyclic</td>
                    <td>hide closed</td>
                    <td>hide timeout</td>
                </tr>
                <tr>
                    <td><input class='z' id='ip' maxlength='15' value='192.168.1'></td>
                    <td><input class='z' id='st' maxlength='3' value='1'></td>
                    <td><input class='z' id='ed' maxlength='3' value='254'></td>
                    <td><input class='z' id='sp' maxlength='5' value='80'></td>
                    <td><input class='z' id='ep' maxlength='5' value='65534'></td>
                    <td><input class='z' id='to' maxlength='4' value='0.2'></td>
                    <td><input class='z' id='cn' maxlength='4' value='10'></td>
                    <td><input type='checkbox' id='rd'></td>
                    <td><input type='checkbox' id='cy'></td>
                    <td><input type='checkbox' id='hc'></td>
                    <td><input type='checkbox' id='ht'></td>
                </tr>
            </table>
            <button id='stsc'>Stop Scan</button>
            <button id='pgsw'>Ping Sweep</button>
            <button id='prsw'>Port Sweep</button>
            <button id='prsc'>Port Scan</button>
            <button id='lssw'>Sweep Listed Ports</button>
            <input class='z' id='lp' style='width:200px' value='21,22,80,81,443,445'>
            <label id='lb' for='cb'>scroll to:<input id='cb' type='checkbox'></label>
            <font id='ver'>(Ver 2.1 Go/Wails)</font>
        </div>
        <p>
        <div id="pr"></div>
    </div>

    <!-- Detail Popup -->
    <div id="popup" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="popup-details"></div>
        </div>
    </div>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
